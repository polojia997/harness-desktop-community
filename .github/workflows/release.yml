name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run build:msi

      - name: Publish MSI
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $msi = @(Get-ChildItem release -Recurse -Filter *.msi)
          if ($msi.Count -ne 1) {
            throw "Expected exactly one MSI, found $($msi.Count)."
          }

          gh release create "${{ github.ref_name }}" `
            $msi[0].FullName `
            --title "Harness Desktop ${{ github.ref_name }}" `
            --generate-notes

name: Windows

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run build:msi

      - uses: actions/upload-artifact@v4
        with:
          name: harness-desktop-windows-x64
          path: release/**/*.msi
          if-no-files-found: error
